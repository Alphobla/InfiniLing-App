[project]
name = "infiniling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "matplotlib>=3.7.0",
    "mutagen>=1.47.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "python-jose>=3.5.0",
    "python-vlc>=3.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "supabase>=2.27.2",
    "wordfreq>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "uvicorn>=0.40.0",
]
