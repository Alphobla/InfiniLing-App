[project]
name = "infiniling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "mutagen>=1.47.0",
    "numpy>=2.3.5",
    "openai>=2.15.0",
    "openai-whisper>=20250625",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "python-vlc>=3.0.21203",
    "sqlalchemy>=2.0.45",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
